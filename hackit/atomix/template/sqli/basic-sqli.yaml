id: nosql-injection
info:
  name: NoSQL Injection
  author: AniipID
  severity: critical
  description: Detects NoSQL injection in MongoDB/Express apps
  tags: sqli,nosql,mongodb
requests:
  - method: GET
    path:
      - "{{BaseURL}}?q[$ne]=admin"
      - "{{BaseURL}}?q[$gt]="
      - "{{BaseURL}}?q[$regex]=.*"
      - "{{BaseURL}}?user[$ne]=admin&pass[$ne]=admin"
    matchers:
      - type: regex
        regex:
          - "Mongo(Server)?Error"
          - "CastError"
          - "BsonTypeError"
          - "BSON field"
          - "unrecognized( operator| option)"
          - "Unexpected token \\$"
        condition: or
        name: "nosql-injection"
---
