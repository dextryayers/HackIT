id: deser-java-rmi
info:
  name: Java RMI Deserialization Detection
  author: AniipID
  severity: critical
  description: Detects exposed Java RMI endpoints that may be vulnerable to deserialization attacks
  tags: deserialization,java,rmi

requests:
  - method: GET
    path:
      - "{{BaseURL}}/rmi"
      - "{{BaseURL}}/jndi"
      - "{{BaseURL}}/invoker"
      - "{{BaseURL}}/JMXInvokerServlet"
    matchers:
      - type: word
        words:
          - "JMXInvokerServlet"
          - "RMIInvokerServlet"
          - "InvokerService"
          - "JmxRemote"
          - "java.rmi."
          - "sun.rmi."
        condition: or
        part: body

  - method: POST
    path:
      - "{{BaseURL}}/invoker/JMXInvokerServlet"
    body: "test"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 500
      - type: regex
        regex:
          - "JMXInvokerServlet"
          - 'javax\.management'
          - 'java\.rmi'
          - 'sun\.rmi'
          - "JmxRemote"
        name: "java-rmi"
