id: deser-python-pickle
info:
  name: Python Pickle Deserialization
  author: AniipID
  severity: critical
  description: Detects Python pickle deserialization endpoints that could lead to RCE
  tags: deserialization,python,pickle,rce

requests:
  - method: POST
    path:
      - "{{BaseURL}}/api/load"
      - "{{BaseURL}}/api/restore"
      - "{{BaseURL}}/deserialize"
    headers:
      Content-Type: application/octet-stream
    body: "gAN9cQAoWAMAAABrZXlxAlgFAAAAdmFsdWVxA3VzLg=="
    matchers:
      - type: regex
        regex:
          - "UnpicklingError"
          - "can.t pickle"
          - "current magic number"
          - '_pickle\.'
          - "cPickle"
          - 'pickle\.loads?'
        condition: or
        name: "python-pickle"

  - method: POST
    path:
      - "{{BaseURL}}/api/session"
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: "session=gAN9cQAoWAQAAABkYXRhcQFYBQAAAHZhbHVlcQJ1cy4="
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 500
      - type: regex
        regex:
          - "UnpicklingError"
          - "can.t pickle"
          - '_pickle\.'
        name: "python-pickle-session"
